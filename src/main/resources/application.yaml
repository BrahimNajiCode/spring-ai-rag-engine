spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  application:
    name: spring-ai-rag-engine
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/rag}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        project-id: ${PROJECT_ID}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: 768

    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768
        index-type: HNSW
        distance-type: COSINE_DISTANCE

rag:
  strategy: NAIVE
  retrieval:
    top-k: 5
    similarity-threshold: 0.0
